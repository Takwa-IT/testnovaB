version: '3.8'

services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: testnova-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: testnova
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-testnovauser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testnovapass}
    ports:
      - "3307:3306"  # Port modifié pour éviter le conflit
    volumes:
      - mysql_data:/var/lib/mysql
      # Migration SQL désactivée temporairement (erreur de syntaxe)
      # - ./migration_fix_token_tables.sql:/docker-entrypoint-initdb.d/migration_fix_token_tables.sql
    networks:
      - testnova-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Spring Boot
  app:
    build:
      context: ./testnova
      dockerfile: Dockerfile
    container_name: testnova-app
    restart: unless-stopped
    ports:
      - "8080:8082"  # Mapper le port 8080 de l'hôte vers 8082 du conteneur
    environment:
      # Configuration du serveur
      SERVER_PORT: 8082
      
      # Configuration de la base de données
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/testnova?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-testnovauser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-testnovapass}
      
      # Configuration OpenAI/Groq
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY}
      
      # Configuration Email
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-testnovaplatform@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      
      # Configuration JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      
      # Configuration du profil
      SPRING_PROFILES_ACTIVE: prod
      
      # Options JVM
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - testnova-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local

networks:
  testnova-network:
    driver: bridge
